name: Сборка и деплой

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Сборка на стороне GitHub: на сервере мало памяти, туда уходят только готовые файлы.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: SSH-ключ
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Выкладка
        # Сначала новые файлы (ассеты с хешами), index.html — последним: сайт не ломается во время выкладки.
        run: |
          rsync -az --exclude index.html -e "ssh -i ~/.ssh/deploy" dist/ modus@${{ secrets.DEPLOY_HOST }}:/srv/modus/frontend/dist/
          rsync -az --delete -e "ssh -i ~/.ssh/deploy" dist/ modus@${{ secrets.DEPLOY_HOST }}:/srv/modus/frontend/dist/

  sync:
    # Обновляем папку frontend/ в общем репозитории Modus-trade/modus.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: SSH-ключ общего репозитория
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SYNC_SSH_KEY }}" > ~/.ssh/sync && chmod 600 ~/.ssh/sync
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Синхронизация в modus
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/sync
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git clone --depth 1 git@github.com:Modus-trade/modus.git mono
          rsync -a --delete --exclude .git --exclude .github src/ mono/frontend/
          cd mono
          git add -A frontend
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          git -c user.name="modus-sync[bot]" -c user.email="sync@modus.local" \
            commit -m "sync frontend: $(echo "$MESSAGE" | head -1)" -m "Источник: Modus-trade/modus-front@${GITHUB_SHA::7}"
          # Бэкенд и фронтенд могут синхронизироваться одновременно — повторяем с подтягиванием.
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            sleep $((i * 3))
            git pull --rebase origin main
          done
          exit 1
